<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Express • แดชบอร์ดการเงิน (สด)</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --line:#e6e9f0; --ink:#1a2233; --muted:#7b869c;
    --accent:#3b6ef5; --good:#12b886; --warn:#f59f00; --bad:#e03131;
    --asset:#3b6ef5; --liability:#e8590c; --equity:#12b886;
    --revenue:#7048e8; --cost:#f59f00; --expense:#e64980; --other:#868e96;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:"Segoe UI","Sarabun",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap{ max-width:1180px; margin:0 auto; padding:22px 18px 70px; }

  header .top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  header h1{ font-size:21px; margin:0 0 4px; }
  header .sub{ color:var(--muted); font-size:13px; }
  .badge{ display:inline-block; font-size:11px; padding:2px 9px; border-radius:20px; margin-left:8px; vertical-align:middle; font-weight:600; }
  .badge.live{ background:#e6f7ee; color:#0b8a53; }
  .refresh{ display:flex; align-items:center; gap:10px; }
  .refresh button{ border:1px solid var(--line); background:#fff; padding:8px 14px; border-radius:9px; font-size:13px; cursor:pointer; font-family:inherit; }
  .refresh button:hover{ background:#f7f9ff; border-color:var(--accent); color:var(--accent); }
  .refresh .stamp{ color:var(--muted); font-size:12px; }

  .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin:18px 0; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; position:relative; overflow:hidden; }
  .card .k{ color:var(--muted); font-size:12px; }
  .card .v{ font-size:22px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
  .card .sfx{ font-size:12px; color:var(--muted); margin-top:2px; }
  .card .stripe{ position:absolute; left:0; top:0; bottom:0; width:4px; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media(max-width:820px){ .grid2{ grid-template-columns:1fr; } }

  .panel{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  .panel h2{ font-size:15px; margin:0 0 4px; }
  .panel .desc{ color:var(--muted); font-size:12px; margin:0 0 14px; }

  /* horizontal bars */
  .bar-row{ display:grid; grid-template-columns:130px 1fr 140px; align-items:center; gap:10px; margin:9px 0; font-size:13px; }
  .bar-track{ background:#eef1f7; border-radius:6px; height:18px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:6px; }
  .bar-val{ text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); }
  @media(max-width:600px){ .bar-row{ grid-template-columns:96px 1fr 92px; font-size:12px; } }

  /* balance sheet compare */
  .stack{ display:flex; height:34px; border-radius:8px; overflow:hidden; border:1px solid var(--line); }
  .stack .seg{ height:100%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:600; white-space:nowrap; }
  .stack-label{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin:4px 2px 12px; font-variant-numeric:tabular-nums; }

  .check{ display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:10px; font-size:13px; margin-top:6px; }
  .check.ok{ background:#e9f9f1; color:#0b7a4b; }
  .check.warn{ background:#fff8e8; color:#8a5a00; }

  /* pie */
  .pie-wrap{ display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
  .pie{ width:170px; height:170px; border-radius:50%; flex:0 0 auto; }
  .legend{ flex:1; min-width:180px; }
  .legend .li{ display:grid; grid-template-columns:14px 1fr auto; align-items:center; gap:9px; font-size:13px; margin:7px 0; }
  .legend .dot{ width:12px; height:12px; border-radius:3px; }
  .legend .amt{ font-variant-numeric:tabular-nums; color:var(--muted); }

  /* income waterfall */
  .flow{ display:grid; grid-template-columns:150px 1fr 150px; align-items:center; gap:10px; margin:8px 0; font-size:13px; }
  .flow .lab{ color:var(--ink); }
  .flow .lab small{ color:var(--muted); display:block; font-size:11px; }
  .flow-track{ position:relative; height:22px; background:#f4f6fb; border-radius:6px; }
  .flow-bar{ position:absolute; top:0; height:100%; border-radius:6px; }
  .flow .amt{ text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }

  /* ratios */
  .ratios{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
  .ratio{ border:1px solid var(--line); border-radius:12px; padding:14px; }
  .ratio .rk{ font-size:13px; font-weight:600; }
  .ratio .rv{ font-size:26px; font-weight:800; margin:4px 0; font-variant-numeric:tabular-nums; }
  .ratio .rd{ font-size:11px; color:var(--muted); line-height:1.5; }
  .pill{ display:inline-block; font-size:11px; padding:2px 9px; border-radius:20px; font-weight:600; }
  .pill.good{ background:#e6f7ee; color:#0b8a53; }
  .pill.warn{ background:#fff4e0; color:#a86b00; }
  .pill.bad{ background:#ffe9e9; color:#c92a2a; }

  /* table */
  .tools{ display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  input[type=search]{ flex:1; min-width:200px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit; }
  select{ padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:#fff; font-family:inherit; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; }
  th{ color:var(--muted); font-weight:600; font-size:12px; position:sticky; top:0; background:#fff; cursor:pointer; user-select:none; }
  th.num,td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .tag{ font-size:11px; padding:2px 8px; border-radius:20px; color:#fff; }
  .tbl-scroll{ max-height:480px; overflow:auto; border:1px solid var(--line); border-radius:10px; }

  .note{ background:#fff8f0; border:1px solid #ffe3c2; color:#8a4b00; font-size:12px; padding:10px 12px; border-radius:8px; margin:14px 0; }
  .state{ text-align:center; padding:50px 20px; color:var(--muted); }
  .state .big{ font-size:15px; color:var(--ink); margin-bottom:8px; }
  .err-box{ background:#fff5f5; border:1px solid #ffc9c9; color:#a61e1e; border-radius:10px; padding:16px; font-size:13px; text-align:left; }
  .err-box pre{ background:#1a2233; color:#e6e9f0; padding:12px; border-radius:8px; overflow:auto; font-size:12px; }
  footer{ color:var(--muted); font-size:12px; text-align:center; margin-top:26px; line-height:1.7; }
  .spin{ display:inline-block; width:16px; height:16px; border:2px solid #cdd6ea; border-top-color:var(--accent); border-radius:50%; animation:sp 0.7s linear infinite; vertical-align:-3px; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  .wk-body{ font-size:14px; line-height:1.75; color:var(--ink); }
  .wk-body .wk-h{ margin:14px 0 6px; font-size:15px; font-weight:700; }
  .wk-body .wk-p{ margin:7px 0; }
  .wk-body .wk-ul{ margin:6px 0 6px 20px; } .wk-body .wk-ul li{ margin:3px 0; }
  .wk-body code{ background:#eef1f7; padding:1px 5px; border-radius:4px; font-size:12px; }
  #weekly{ border-left:4px solid var(--accent); }
  .card .delta{ font-size:12px; margin-top:6px; font-weight:600; font-variant-numeric:tabular-nums; }
  .card .delta.up{ color:#0b8a53; } .card .delta.down{ color:#c92a2a; } .card .delta.flat{ color:var(--muted); font-weight:500; }
  .card .delta .dsub{ color:var(--muted); font-weight:400; font-size:11px; }
  .seg-toggle{ display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; margin:2px 0 8px; }
  .seg-toggle button{ border:0; background:#fff; padding:6px 12px; font-size:12.5px; cursor:pointer; color:var(--muted); }
  .seg-toggle button.on{ background:var(--accent); color:#fff; font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div>
        <h1 id="company">บริษัท สินอุดมคอนกรีต จำกัด <span class="badge live">● LIVE</span></h1>
        <div class="sub" id="asof">กำลังเชื่อมต่อ Supabase…</div>
      </div>
      <div class="refresh">
        <label for="periodSel" style="font-size:13px;color:var(--muted)">งวด:</label>
        <select id="periodSel" onchange="showPeriod(this.value)" style="padding:7px 10px;border:1px solid #d8deea;border-radius:9px;font-size:13px;background:#fff;cursor:pointer"></select>
        <span class="stamp" id="stamp"></span>
        <button id="reloadBtn" onclick="load()">↻ รีเฟรช</button>
      </div>
    </div>
  </header>

  <div id="app">
    <div class="state"><div class="spin"></div> กำลังโหลดข้อมูลจากคลาวด์…</div>
  </div>

  <footer>
    แดชบอร์ดวิเคราะห์งบทดลอง/กระดาษทำการ • ดึงข้อมูลสดจาก Supabase (ตาราง <code>express_trial_balance</code>)<br>
    ตัวเลขทั้งหมดคำนวณจากยอดคงเหลือแต่ละบัญชีในรายงาน Express — ใช้เพื่อดูภาพรวม ไม่ใช่งบการเงินฉบับตรวจสอบ
  </footer>
</div>

<script>
/* ═══════════ ตั้งค่า ═══════════ */
const SUPABASE_URL  = 'https://dmxegqmhxarabyqduikb.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRteGVncW1oeGFyYWJ5cWR1aWtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMTA2NjksImV4cCI6MjEwMjY4NjY2OX0.R1NyeKfVmjnp48zGHdMeB6XsChlHd8N5KD67k8RTWI8';
const TABLE = 'express_trial_balance';
const COMPANY = 'บริษัท สินอุดมคอนกรีต จำกัด (สำนักงานใหญ่)';
const AUTO_REFRESH_MIN = 10;   // รีเฟรชเองทุกกี่นาที
const DEFAULT_PERIOD = '2569-06-30';  // งวดที่โชว์ตอนเปิด (ว่าง='' = งวดล่าสุดอัตโนมัติ) | 1 ม.ค.–30 มิ.ย. 2569
/* ═══════════════════════════════ */

const CAT_TH = { asset:'สินทรัพย์', liability:'หนี้สิน', equity:'ส่วนของเจ้าของ',
                 revenue:'รายได้', cost:'ต้นทุน', expense:'ค่าใช้จ่าย', other:'อื่นๆ' };
const CAT_COLOR = { asset:'#3b6ef5', liability:'#e8590c', equity:'#12b886',
                    revenue:'#7048e8', cost:'#f59f00', expense:'#e64980', other:'#868e96' };
const CAT_ORDER = ['asset','liability','equity','revenue','cost','expense','other'];
/* หมวดที่ยอดปกติอยู่ฝั่งเดบิต (amount=เดบิต−เครดิต จะเป็นบวกอยู่แล้ว)
   ส่วนหนี้สิน/ทุน/รายได้ เป็นฝั่งเครดิต ต้องพลิกเครื่องหมายให้เป็นบวก */
const DEBIT_NAT = { asset:1, cost:1, expense:1, other:1 };
const dispVal = r => (DEBIT_NAT[r.cat] ? 1 : -1) * (Number(r.amount)||0);

const baht  = n => (n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const short = n => {
  const a=Math.abs(n||0), s=n<0?'-':'';
  if(a>=1e6) return s+(a/1e6).toFixed(2)+' ล้าน';
  if(a>=1e3) return s+(a/1e3).toFixed(1)+' พัน';
  return s+a.toFixed(0);
};
const pct = n => (isFinite(n)? (n*100).toFixed(1)+'%' : '—');
const el  = id => document.getElementById(id);
const _esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* แปลง Markdown แบบง่าย (escape ก่อนเสมอ กัน XSS) */
function mdToHtml(md){
  const lines = _esc(md).split(/\r?\n/);
  const inline = t => t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
                       .replace(/\*([^*]+)\*/g,'<i>$1</i>')
                       .replace(/`([^`]+)`/g,'<code>$1</code>');
  let html='', inList=false; const closeList=()=>{ if(inList){ html+='</ul>'; inList=false; } };
  for(const ln of lines){
    let m;
    if(m=ln.match(/^\s*(#{1,6})\s+(.*)/)){ closeList(); html+=`<div class="wk-h">${inline(m[2])}</div>`; continue; }
    if(m=ln.match(/^\s*[-*]\s+(.*)/)){ if(!inList){ html+='<ul class="wk-ul">'; inList=true; } html+=`<li>${inline(m[1])}</li>`; continue; }
    if(ln.trim()===''){ closeList(); continue; }
    closeList(); html+=`<p class="wk-p">${inline(ln)}</p>`;
  }
  closeList(); return html;
}

/* ดึงสรุปประจำสัปดาห์ล่าสุดจาก Supabase มาแสดง */
async function loadWeekly(){
  const box = el('weekly'); if(!box) return;
  const head = '<h2>📝 สรุป & วิเคราะห์ประจำสัปดาห์ (โดย Claude)</h2>';
  try{
    const url = `${SUPABASE_URL}/rest/v1/weekly_summary?select=*&order=week_ending.desc&limit=1`;
    const res = await fetch(url, { headers:{ apikey:SUPABASE_ANON, Authorization:`Bearer ${SUPABASE_ANON}`, Accept:'application/json' }});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const rows = await res.json();
    if(!Array.isArray(rows) || rows.length===0){
      box.innerHTML = head + '<p class="desc">ยังไม่มีสรุปประจำสัปดาห์ — ระบบจะสร้างให้อัตโนมัติทุกเช้าวันจันทร์</p>';
      return;
    }
    const r = rows[0];
    const gen = r.generated_at ? new Date(r.generated_at).toLocaleString('th-TH') : '';
    box.innerHTML = head +
      `<p class="desc">งวดข้อมูล: ${_esc(r.period_label||'—')}${gen?' • สร้างเมื่อ '+_esc(gen):''}${r.week_ending?' • สัปดาห์ '+_esc(r.week_ending):''}</p>` +
      `<div class="wk-body">${mdToHtml(r.summary_md||'')}</div>`;
  }catch(err){
    box.innerHTML = head + `<p class="desc" style="color:#c92a2a">โหลดสรุปไม่สำเร็จ: ${_esc(err.message||err)}</p>`;
  }
}

let ROWS = [];       // ข้อมูลดิบของงวดที่กำลังดู
let AGG  = null;     // ผลรวมงวดปัจจุบัน
let PREV_AGG = null; // ผลรวมงวดก่อนหน้า (ไว้เทียบ ▲▼ และคิดรายเดือน)
let PREV_PERIOD = '';// รหัสงวดก่อนหน้า
let MONTHLY_MODE = false; // งบกำไรขาดทุน: false=สะสมตั้งแต่ต้นปี, true=เฉพาะเดือนนี้
let PERIODS = [];     // รายชื่องวดที่เลือกดูได้ (ใหม่→เก่า, ไม่รวมอนาคต)
let CURRENT_PERIOD = '';

const _H = () => ({ apikey:SUPABASE_ANON, Authorization:`Bearer ${SUPABASE_ANON}`, Accept:'application/json' });
const fetchPeriodRows = async p => {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=*&period=eq.${encodeURIComponent(p)}&limit=10000`, { headers:_H() });
  if(!r.ok) return null;
  const rows = await r.json();
  return Array.isArray(rows) ? rows : null;
};
// ป้ายงวดแบบช่วง: งบกำไรขาดทุนเป็นยอดสะสมตั้งแต่ต้นปี → "1 ม.ค. – <วันที่งวด>"
const periodRangeLabel = (p, lbl) => {
  const end = (lbl||'').replace(/^ณ\s*/,'').trim() || p;
  return '1 ม.ค. – ' + end;
};

/* ค้นหางวดที่เลือกดูได้ (ไม่รวมอนาคต) + เติม dropdown แล้วเปิดงวดเริ่มต้น */
async function load(){
  el('reloadBtn').disabled = true;
  el('app').innerHTML = '<div class="state"><div class="spin"></div> กำลังโหลดข้อมูลจากคลาวด์…</div>';
  try{
    // วันนี้ในรูป พ.ศ. (period เก็บเป็น พ.ศ. = ค.ศ.+543) — กรองงวดอนาคตที่ฝั่ง DB เลี่ยงเพดาน 1000 แถว
    const d=new Date(), todayTH=(d.getFullYear()+543)+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    let pres = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=period,period_label&period=lte.${todayTH}&order=period.desc&limit=1000`, { headers:_H() });
    if(!pres.ok){ const b=await pres.text(); throw new Error(`HTTP ${pres.status} — ${b}`); }
    let prows = await pres.json();
    if(!Array.isArray(prows) || prows.length===0){
      pres = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=period,period_label&order=period.desc&limit=1000`, { headers:_H() });
      prows = pres.ok ? await pres.json() : [];
    }
    if(!Array.isArray(prows) || prows.length===0){ renderEmpty(); return; }
    // งวดไม่ซ้ำ + จำนวนบัญชี (จากตัวอย่าง 1000 แถวแรก) ไว้กรองงวดที่ข้อมูลไม่ครบ
    const cnt={}, lbl={}, seen=new Set(); PERIODS=[];
    prows.forEach(r=>{ if(!r.period) return; cnt[r.period]=(cnt[r.period]||0)+1; if(!lbl[r.period]) lbl[r.period]=r.period_label||r.period;
      if(!seen.has(r.period)){ seen.add(r.period); PERIODS.push(r.period); } });
    // เก็บเฉพาะงวดที่ดูมีข้อมูลพอ (>=10 บัญชี) เพื่อไม่ให้เลือกงวดที่อัปโหลดไม่ครบ
    const valid = PERIODS.filter(p=> (cnt[p]||0) >= 10);
    PERIODS = valid.length ? valid : PERIODS;
    // เติม dropdown
    el('periodSel').innerHTML = PERIODS.map(p=>`<option value="${_esc(p)}">${_esc(periodRangeLabel(p,lbl[p]))}</option>`).join('');
    // งวดเริ่มต้น: ใช้ DEFAULT_PERIOD ถ้ามีอยู่ในลิสต์ ไม่งั้นเอางวดล่าสุด
    let start = (DEFAULT_PERIOD && PERIODS.includes(DEFAULT_PERIOD)) ? DEFAULT_PERIOD : PERIODS[0];
    el('periodSel').value = start;
    await showPeriod(start);
  }catch(err){
    renderError(err);
  }finally{
    el('reloadBtn').disabled = false;
  }
}

/* โหลด+แสดงงวดที่ระบุ */
async function showPeriod(p){
  if(!p) return;
  CURRENT_PERIOD = p;
  el('reloadBtn').disabled = true;
  el('app').innerHTML = '<div class="state"><div class="spin"></div> กำลังโหลดงวด '+_esc(p)+'…</div>';
  try{
    const rows = await fetchPeriodRows(p);
    if(!rows || rows.length===0){ renderEmpty(); return; }
    ROWS = rows;
    ROWS.forEach(r=>{ r.amount=Number(r.amount)||0; r.tb_debit=Number(r.tb_debit)||0; r.tb_credit=Number(r.tb_credit)||0; r.cat=r.cat||'other'; r.disp=dispVal(r); });
    compute();
    // งวดก่อนหน้า (ถัดไปในลิสต์ที่เรียงใหม่→เก่า) ไว้เทียบ ▲▼ และคิดรายเดือน
    PREV_AGG = null; PREV_PERIOD = '';
    const idx = PERIODS.indexOf(p);
    if(idx >= 0 && idx+1 < PERIODS.length){
      const pp = PERIODS[idx+1];
      try{
        const prows = await fetchPeriodRows(pp);
        if(prows && prows.length){
          prows.forEach(r=>{ r.amount=Number(r.amount)||0; r.cat=r.cat||'other'; });
          PREV_AGG = computeAgg(prows); PREV_PERIOD = pp;
        }
      }catch(_){ /* ไม่มีงวดก่อนก็ข้ามไป */ }
    }
    renderAll();
    const now = new Date();
    el('stamp').textContent = 'อัปเดตเมื่อ ' + now.toLocaleTimeString('th-TH');
    const sd=ROWS.reduce((s,r)=>s+r.tb_debit,0), sc=ROWS.reduce((s,r)=>s+r.tb_credit,0);
    const balTxt = Math.abs(sd-sc)<1 ? ' • เดบิต=เครดิต ✓' : ' • ⚠ เดบิต≠เครดิต';
    el('asof').textContent = (ROWS[0].as_of || ROWS[0].period_label || p) + '  •  ' + ROWS.length.toLocaleString('th-TH') + ' บัญชี' + balTxt;
    if(el('periodSel').value !== p) el('periodSel').value = p;
  }catch(err){
    renderError(err);
  }finally{
    el('reloadBtn').disabled = false;
  }
}

/* แมป "หมุนเวียน" จากเลขบัญชีจริง (ปรับได้): 11-=สินทรัพย์หมุนเวียน, 21-=หนี้สินหมุนเวียน, ชื่อมี "คงเหลือ"=สินค้าคงเหลือ */
const isCurAsset = r => r.cat==='asset' && /^11-/.test(r.code||'');
const isInventory = r => r.cat==='asset' && /คงเหลือ/.test(r.name||'');
const isCurLiab  = r => r.cat==='liability' && /^21-/.test(r.code||'');

/* คำนวณผลรวมจากชุดแถวที่ให้มา แล้วคืนเป็น object (ใช้ได้ทั้งงวดปัจจุบันและงวดก่อน) */
function computeAgg(rows){
  if(!rows || !rows.length) return null;
  // พลิกเครื่องหมายให้ทุกหมวดเป็น "ยอดปกติเป็นบวก": เดบิต→+amount, เครดิต→−amount
  const sum = c => rows.filter(r=>r.cat===c).reduce((s,r)=>s+dispVal(r),0);
  const asset=sum('asset'), liability=sum('liability'), equity=sum('equity'),
        revenue=sum('revenue'), cost=sum('cost'), expense=sum('expense'), other=sum('other');
  const grossProfit = revenue - cost;
  const netProfit   = revenue - cost - expense;
  const equityTotal = equity + netProfit;              // ส่วนของเจ้าของรวมกำไรงวดนี้
  const claims      = liability + equityTotal;          // สิทธิเรียกร้อง = หนี้สิน + ทุน(รวมกำไร)
  const byCat = {}; CAT_ORDER.forEach(c=>byCat[c]=sum(c));
  // สภาพคล่อง
  const curAsset = rows.filter(isCurAsset).reduce((s,r)=>s+dispVal(r),0);
  const inventory = rows.filter(isInventory).reduce((s,r)=>s+dispVal(r),0);
  const curLiab  = rows.filter(isCurLiab).reduce((s,r)=>s+dispVal(r),0);
  const safe = (a,b)=> b? a/b : NaN;
  return {
    asset, liability, equity, revenue, cost, expense, other,
    grossProfit, netProfit, equityTotal, claims, byCat,
    curAsset, inventory, curLiab,
    accounts: rows.length,
    ratios:{
      de:      safe(liability, equityTotal),   // หนี้สินต่อทุน
      debt:    safe(liability, asset),         // หนี้สินต่อสินทรัพย์
      roa:     safe(netProfit, asset),
      roe:     safe(netProfit, equityTotal),
      gross:   safe(grossProfit, revenue),
      net:     safe(netProfit, revenue),
      current: safe(curAsset, curLiab),               // สินทรัพย์หมุนเวียน/หนี้สินหมุนเวียน
      quick:   safe(curAsset - inventory, curLiab),   // (หมุนเวียน−สินค้าคงเหลือ)/หนี้สินหมุนเวียน
    }
  };
}
function compute(){ AGG = computeAgg(ROWS); }

/* เกณฑ์ไฟจราจร (แนวทางทั่วไป — แต่ละอุตสาหกรรมต่างกัน) */
function grade(key, v){
  if(!isFinite(v)) return {cls:'warn', txt:'—'};
  const rules = {
    de:   [[1,'good'],[2,'warn'],[Infinity,'bad']],      // ยิ่งต่ำยิ่งดี
    debt: [[0.5,'good'],[0.7,'warn'],[Infinity,'bad']],  // ยิ่งต่ำยิ่งดี
  };
  if(rules[key]){
    for(const [th,cls] of rules[key]) if(v<th) return {cls, txt: cls==='good'?'ดี':cls==='warn'?'ปานกลาง':'สูง'};
  }
  // สภาพคล่อง: ยิ่งสูงยิ่งดี (current/quick) — ป้ายต่างจากอัตรากำไร
  const liq = { current:[1,2], quick:[0.5,1] }[key];
  if(liq){
    if(v<liq[0]) return {cls:'bad', txt:'เสี่ยง'};
    if(v<liq[1]) return {cls:'warn', txt:'พอใช้'};
    return {cls:'good', txt:'ดี'};
  }
  // ยิ่งสูงยิ่งดี (roa/roe/gross/net)
  const up = { roa:[0,0.05], roe:[0,0.10], gross:[0,0.20], net:[0,0.05] }[key] || [0,0.1];
  if(v<up[0]) return {cls:'bad', txt:'ขาดทุน'};
  if(v<up[1]) return {cls:'warn', txt:'พอใช้'};
  return {cls:'good', txt:'ดี'};
}

/* ป้ายเทียบงวดก่อน ▲▼ %  (higherGood=true → เพิ่ม=เขียว, false → เพิ่ม=แดง เช่นหนี้สิน) */
function deltaTag(cur, prev, higherGood){
  if(prev===undefined || prev===null || !isFinite(prev) || Math.abs(prev)<1e-9) return '';
  const diff = cur - prev;
  const pctChg = diff/Math.abs(prev)*100;
  if(Math.abs(pctChg) < 0.05) return `<div class="delta flat">— ทรงตัว</div>`;
  const up = diff > 0;
  const good = higherGood ? up : !up;
  const arrow = up ? '▲' : '▼';
  return `<div class="delta ${good?'up':'down'}">${arrow} ${Math.abs(pctChg).toFixed(1)}% <span class="dsub">จากงวดก่อน</span></div>`;
}

}

    ? { revenue:a.revenue-PREV_AGG.revenue, cost:a.cost-PREV_AGG.cost, expense:a.expense-PREV_AGG.expense,
        grossProfit:(a.revenue-PREV_AGG.revenue)-(a.cost-PREV_AGG.cost),
        netProfit:a.netProfit-PREV_AGG.netProfit }
    : { revenue:a.revenue, cost:a.cost, expense:a.expense, grossProfit:a.grossProfit, netProfit:a.netProfit };
  const gm = V.revenue? V.grossProfit/V.revenue : NaN;

    const q = el('q').value.trim().toLowerCase();
    const cf = el('catFilter').value;
    let rows = ROWS.filter(r=> (!cf||r.cat===cf) && (!q || (r.name||'').toLowerCase().includes(q) || (r.code||'').includes(q)));
    rows.sort((a,b)=>{ let x=a[sortKey], y=b[sortKey];
      if(sortKey==='disp'||sortKey==='amount'){ return (x-y)*sortDir; }
      return String(x).localeCompare(String(y),'th')*sortDir; });
    el('tbody').innerHTML = rows.map(r=>`
      <tr>
        <td>${r.code||''}</td>
        <td>${r.name||''}</td>
        <td><span class="tag" style="background:${CAT_COLOR[r.cat]||'#868e96'}">${CAT_TH[r.cat]||r.cat}</span></td>
        <td class="num">${baht(r.disp)}</td>
      </tr>`).join('') || `<tr><td colspan="4" style="text-align:center;color:#7b869c;padding:22px">ไม่พบรายการ</td></tr>`;
  };
  el('q').addEventListener('input', draw);
  el('catFilter').addEventListener('change', draw);
  el('tablepanel').querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{
    const k=th.dataset.k; if(k===sortKey) sortDir*=-1; else { sortKey=k; sortDir = (k==='disp'||k==='amount')?-1:1; } draw();
  }));
  draw();
}

function renderEmpty(){
  el('app').innerHTML = `<div class="state">
    <div class="big">เชื่อมต่อสำเร็จ แต่ยังไม่มีข้อมูลในตาราง</div>
    ตาราง <code>${TABLE}</code> ว่างอยู่ — ลองรัน <code>sync_express.py</code> บนเครื่อง server เพื่อส่งข้อมูลขึ้นมาก่อน
  </div>`;
  el('asof').textContent = 'ตารางว่าง';
}

function renderError(err){
  const msg = (err && err.message) || String(err);
  const rls = /permission|denied|401|row-level|RLS|JWT/i.test(msg);
  el('app').innerHTML = `<div class="state">
    <div class="err-box">
      <div class="big" style="margin-bottom:8px">โหลดข้อมูลไม่สำเร็จ</div>
      <div style="margin-bottom:10px">${msg}</div>
      ${rls ? `<div style="margin-bottom:8px">ดูเหมือนตารางยังไม่เปิดให้อ่านแบบสาธารณะ — เปิด Supabase → <b>SQL Editor</b> แล้วรันคำสั่งนี้ (ทำจากเครื่องไหนก็ได้ ไม่ต้องแตะ server):</div>
      <pre>alter table public.${TABLE} enable row level security;
create policy "public read ${TABLE}"
  on public.${TABLE} for select
  to anon using (true);</pre>
      <div>แล้วกด ↻ รีเฟรช อีกครั้ง</div>` : `<div>ลองกด ↻ รีเฟรช อีกครั้ง หรือเช็กอินเทอร์เน็ต</div>`}
    </div>
  </div>`;
  el('asof').textContent = 'เกิดข้อผิดพลาด';
}

load();
// รีเฟรชอัตโนมัติแบบไม่เด้งกลับงวดเริ่มต้น: โหลดซ้ำเฉพาะงวดที่กำลังดูอยู่
if(AUTO_REFRESH_MIN>0) setInterval(()=>{ if(CURRENT_PERIOD) showPeriod(CURRENT_PERIOD); else load(); }, AUTO_REFRESH_MIN*60*1000);
</script>
